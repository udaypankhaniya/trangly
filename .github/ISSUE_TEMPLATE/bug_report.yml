name: Bug Report
description: Something isn't working correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing a bug, please check [existing issues](https://github.com/udaypankhaniya/trangly/issues) to avoid duplicates.

  - type: input
    id: version
    attributes:
      label: Trangly version
      description: Output of `trangly version`
      placeholder: "Trangly v1.0.0 (commit abc1234, built 2026-04-03)"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS & Docker version
      description: e.g. Ubuntu 22.04, Docker 26.1.4, Compose 2.27.0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps that trigger the bug
      placeholder: |
        1. Create a project pointing to repo X
        2. Push a commit to main
        3. See error in deploy log
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste relevant lines from `~/.trangly/logs/<deploy-id>.log` or the Trangly server output
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am running the latest release
          required: true
