name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Trangly is intentionally focused on push-to-deploy for Docker apps.
        Requests outside that scope (multi-user, GitLab, Kubernetes, non-Docker) will be closed.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that Trangly can't do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see added or changed
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried or considered

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This is within the scope of Trangly (push-to-deploy for Docker apps on a VPS)
          required: true
        - label: I searched existing issues and this is not a duplicate
          required: true
