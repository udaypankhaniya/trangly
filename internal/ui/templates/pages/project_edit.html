{{define "head_extra"}}
<link rel="stylesheet" href="/static/vendor/tom-select.min.css" />
<script src="/static/vendor/tom-select.complete.min.js"></script>
{{end}}

{{define "content"}}
<main class="page-container">

    <!-- Loading skeleton -->
    <div x-show="projectLoading" class="animate-pulse space-y-4 max-w-2xl">
        <div class="h-8 bg-[var(--bg-raised)] rounded w-48"></div>
        <div class="h-4 bg-[var(--bg-raised)] rounded w-72"></div>
        <div class="h-64 bg-[var(--bg-raised)] rounded"></div>
    </div>

    <!-- Error state -->
    <div x-show="!projectLoading && pageError" class="max-w-2xl">
        <div class="alert-error mb-4">
            <svg class="icon" aria-hidden="true"><use href="#icon-circle-exclamation"></use></svg>
            <span x-text="pageError"></span>
        </div>
        <a href="/dashboard" class="btn-secondary text-sm">
            <svg class="icon text-xs" aria-hidden="true"><use href="#icon-arrow-left"></use></svg>
            Back to Dashboard
        </a>
    </div>

    <!-- Main form -->
    <div x-show="!projectLoading && !pageError">

        <!-- Page header -->
        <div class="flex items-center gap-3 mb-6">
            <a :href="projectId ? '/project?id=' + projectId : '/dashboard'"
                class="btn-ghost px-2 text-[var(--text-muted)] hover:text-[var(--text-primary)]" title="Back">
                <svg class="icon" aria-hidden="true"><use href="#icon-arrow-left"></use></svg>
            </a>
            <div>
                <h1 class="page-title mb-0.5" x-text="projectId ? 'Edit Project' : 'New Project'"></h1>
                <p class="body-sm font-mono"
                    x-text="projectId ? form.name || 'Loading\u2026' : 'Configure your deployment'"></p>
            </div>
        </div>

        <!-- Tab bar -->
        <div class="flex gap-0 border-b border-[var(--border-default)] mb-6">
            <button @click="activeTab = 'general'"
                class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 transition-colors" :class="activeTab === 'general'
                    ? 'border-[var(--accent)] text-[var(--accent)]'
                    : 'border-transparent text-[var(--text-muted)] hover:text-[var(--text-primary)]'">
                <svg class="icon mr-1.5 text-xs" aria-hidden="true"><use href="#icon-sliders"></use></svg>
                General
            </button>
            <button @click="activeTab = 'env'"
                class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 transition-colors" :class="activeTab === 'env'
                    ? 'border-[var(--accent)] text-[var(--accent)]'
                    : 'border-transparent text-[var(--text-muted)] hover:text-[var(--text-primary)]'">
                <svg class="icon mr-1.5 text-xs" aria-hidden="true"><use href="#icon-lock"></use></svg>
                Environment
                <span x-show="envVarCount() > 0"
                    class="ml-1.5 text-[10px] font-mono px-1.5 py-0.5 rounded-full bg-[var(--accent-subtle)] text-[var(--accent)] border border-[var(--accent)]/30"
                    x-text="envVarCount()"></span>
            </button>
        </div>

        <form autocomplete="off" @submit.prevent class="max-w-2xl">

            <!-- ── GENERAL TAB ─────────────────────────────────────── -->
            <div x-show="activeTab === 'general'" class="space-y-5">

                <!-- Repository -->
                <div class="space-y-2">
                    <label>Repository</label>
                    <!-- TomSelect picker for new projects with connected GitHub -->
                    <template x-if="!projectId && githubConnected && repos.length > 0">
                        <select id="repo-select"
                                x-init="$nextTick(() => _initRepoSelect())"
                                @change="form.repo_full_name = $event.target.value; onRepoSelect()">
                            <option value="">Search repositories&hellip;</option>
                        </select>
                    </template>
                    <!-- Read-only display when editing -->
                    <template x-if="projectId">
                        <div
                            class="flex items-center gap-2 px-3 py-2 rounded bg-[var(--bg-raised)] border border-[var(--border-subtle)]">
                            <svg class="icon text-[var(--text-muted)] text-sm" aria-hidden="true"><use href="#icon-github"></use></svg>
                            <span class="font-mono text-sm text-[var(--text-primary)]"
                                x-text="form.repo_full_name"></span>
                            <span class="ml-auto text-[10px] text-[var(--text-muted)] font-mono">read-only</span>
                        </div>
                    </template>
                    <!-- Text input fallback for new project without connected GitHub -->
                    <template x-if="!projectId && (!githubConnected || repos.length === 0)">
                        <div>
                            <input type="text" x-model="form.repo_full_name" placeholder="owner/repo" />
                            <p x-show="!githubConnected"
                                class="text-[var(--color-warn)] font-mono text-[10px] mt-1 flex items-center gap-1">
                                <svg class="icon text-xs" aria-hidden="true"><use href="#icon-triangle-exclamation"></use></svg>
                                Connect GitHub in <a href="/settings" class="underline ml-1">Settings</a> for repo
                                picker
                            </p>
                        </div>
                    </template>
                </div>

                <!-- Project Name -->
                <div class="space-y-2">
                    <label>Project Name</label>
                    <input type="text" x-model="form.name" placeholder="my-app" />
                </div>

                <!-- Branch + Compose File -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label>Branch</label>
                        <div class="relative">
                            <select x-show="branches.length > 0" x-model="form.default_branch"
                                @change="onBranchChange()" class="w-full">
                                <template x-for="b in branches" :key="b.name">
                                    <option :value="b.name" x-text="b.name"></option>
                                </template>
                            </select>
                            <input x-show="branches.length === 0" type="text" x-model="form.default_branch"
                                placeholder="main" />
                            <span x-show="branchesLoading" class="absolute right-2 top-1/2 -translate-y-1/2">
                                <svg class="icon icon-spin text-[var(--text-muted)] text-sm" aria-hidden="true"><use href="#icon-circle-notch"></use></svg>
                            <select x-show="composeFiles.length > 0" x-model="form.compose_path" class="w-full">
                                <template x-for="f in composeFiles" :key="f">
                                    <option :value="f" x-text="f"></option>
                                </template>
                            </select>
                            <input x-show="composeFiles.length === 0" type="text" x-model="form.compose_path"
                                placeholder="docker-compose.yml" />
                            <span x-show="composeLoading" class="absolute right-2 top-1/2 -translate-y-1/2">
                                <svg class="icon icon-spin text-[var(--text-muted)] text-sm" aria-hidden="true"><use href="#icon-circle-notch"></use></svg>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Deploy Mode -->
                <div class="space-y-2">
                    <label>Deploy Mode</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-start gap-3 p-3 rounded border cursor-pointer transition-all" :class="form.deploy_mode === 'rebuild'
                                ? 'border-[var(--accent)] bg-[var(--accent-subtle)]'
                                : 'border-[var(--border-default)] hover:border-[var(--border-strong)]'">
                            <input type="radio" name="deploy_mode" value="rebuild" x-model="form.deploy_mode"
                                class="mt-0.5" />
                            <div>
                                <div class="text-xs font-mono font-bold uppercase">Full Rebuild</div>
                                <div class="text-[10px] text-[var(--text-muted)] mt-0.5">Build image &amp; swap
                                    containers</div>
                            </div>
                        </label>
                        <label class="flex items-start gap-3 p-3 rounded border cursor-pointer transition-all" :class="form.deploy_mode === 'hot_swap'
                                ? 'border-[var(--accent)] bg-[var(--accent-subtle)]'
                                : 'border-[var(--border-default)] hover:border-[var(--border-strong)]'">
                            <input type="radio" name="deploy_mode" value="hot_swap" x-model="form.deploy_mode"
                                class="mt-0.5" />
                            <div>
                                <div class="text-xs font-mono font-bold uppercase">Hot Swap</div>
                                <div class="text-[10px] text-[var(--text-muted)] mt-0.5">Copy files only (PHP, Laravel)
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Memory Limit -->
                <div class="space-y-2">
                    <label>Memory Limit (MB, 0 = auto)</label>
                    <input type="number" x-model.number="form.mem_limit_mb" min="0" placeholder="0" class="w-48" />
                </div>

            </div><!-- /general tab -->

            <!-- ── ENV TAB ─────────────────────────────────────────── -->
            <div x-show="activeTab === 'env'">

                <!-- Loading -->
                <div x-show="envLoading" class="flex items-center gap-2 text-sm text-[var(--text-muted)] py-6">
                    <svg class="icon icon-spin" aria-hidden="true"><use href="#icon-circle-notch"></use></svg>
                    Loading environment variables&hellip;
                </div>

                <div x-show="!envLoading">
                    <!-- Header row -->
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <p class="text-xs text-[var(--text-muted)]">
                                Stored encrypted with AES-256. Never committed to git.
                            </p>
                        </div>
                        <label class="btn-ghost text-xs cursor-pointer px-2 py-1.5 flex items-center gap-1.5 shrink-0">
                            <svg class="icon text-[10px]" aria-hidden="true"><use href="#icon-upload"></use></svg>
                            Upload .env
                            <input type="file" accept=".env,text/plain" class="hidden"
                                @change="$event.target.files[0] && parseEnvFile($event.target.files[0]); $event.target.value = ''" />
                        </label>
                    </div>

                    <!-- Column headers -->
                    <div x-show="envVars.length > 0" class="grid grid-cols-[1fr_1fr_auto] gap-2 px-1 mb-1">
                        <p class="label-mono text-[9px]">KEY</p>
                        <p class="label-mono text-[9px]">VALUE</p>
                        <p class="w-16"></p>
                    </div>

                    <!-- Variable rows -->
                    <div class="space-y-2">
                        <template x-for="(v, i) in envVars" :key="i">
                            <div class="grid grid-cols-[1fr_1fr_auto] gap-2 items-center">
                                <!-- Key -->
                                <input type="text" x-model="envVars[i].key" placeholder="KEY" class="font-mono text-xs"
                                    autocomplete="off" spellcheck="false" />
                                <!-- Value (password/text toggled) -->
                                <div class="relative">
                                    <input :type="v.visible ? 'text' : 'password'" x-model="envVars[i].value"
                                        placeholder="value" class="font-mono text-xs w-full pr-8" autocomplete="new-password"
                                        spellcheck="false" />
                                    <button type="button" @click="toggleVisible(i)"
                                        class="absolute right-2 top-1/2 -translate-y-1/2 text-[var(--text-muted)] hover:text-[var(--text-primary)] transition-colors"
                                        :title="v.visible ? 'Hide value' : 'Show value'">
                                        <svg class="icon" x-show="v.visible" aria-hidden="true"><use href="#icon-eye-slash"></use></svg>
                                        <svg class="icon" x-show="!v.visible" aria-hidden="true"><use href="#icon-eye"></use></svg>
                                    </button>
                                </div>
                                <!-- Remove -->
                                <button type="button" @click="removeVar(i)"
                                    class="btn-ghost px-2 py-1.5 text-[var(--text-muted)] hover:text-[var(--color-fail)] transition-colors"
                                    title="Remove">
                                    <svg class="icon text-xs" aria-hidden="true"><use href="#icon-xmark"></use></svg>
                                </button>
                            </div>
                        </template>
                    </div>

                    <!-- Add variable button -->
                    <button type="button" @click="addVar()"
                        class="mt-3 btn-ghost text-xs px-3 py-2 w-full border border-dashed border-[var(--border-default)] hover:border-[var(--border-strong)] flex items-center justify-center gap-2">
                        <svg class="icon text-[10px]" aria-hidden="true"><use href="#icon-plus"></use></svg>
                        Add variable
                    </button>

                    <!-- Empty state -->
                    <div x-show="envVars.length === 0" class="text-center py-8 text-[var(--text-muted)] text-xs">
                        No environment variables. Add one above or upload a <code>.env</code> file.
                    </div>
                </div>

            </div><!-- /env tab -->

            <!-- ── Error + Actions ─────────────────────────────────── -->
            <div class="mt-8 pt-6 border-t border-[var(--border-subtle)] space-y-4">
                <div x-show="formError" class="alert-error">
                <svg class="icon" aria-hidden="true"><use href="#icon-circle-exclamation"></use></svg>
                    <span x-text="formError"></span>
                </div>
                <div class="flex items-center gap-3">
                    <button type="button" @click="save()" :disabled="formLoading" class="btn-primary">
                        <svg class="icon icon-spin" x-show="formLoading" aria-hidden="true"><use href="#icon-circle-notch"></use></svg>
                        <svg class="icon" x-show="!formLoading" aria-hidden="true"><use href="#icon-floppy-disk"></use></svg>
                        <span x-text="formLoading ? 'Saving\u2026' : 'Save Project'"></span>
                    </button>
                    <button type="button" @click="cancel()" class="btn-secondary">Cancel</button>
                </div>
            </div>

        </form><!-- /max-w-2xl -->
    </div><!-- /main form -->

</main>
{{end}}

{{define "scripts"}}
<script src="/static/js/project_edit.js"></script>
{{end}}
