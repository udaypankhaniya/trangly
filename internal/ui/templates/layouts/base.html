{{define "base"}}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  {{template "head" .}}
  {{block "head_extra" .}}{{end}}
</head>
<body class="font-sans antialiased noise-overlay" x-data="{{.AlpineData}}" x-cloak>
  {{template "icons" .}}
  {{template "sidebar" .}}
  {{template "mobile_menu" .}}

  <!-- Mobile top bar -->
  <div class="mobile-topbar">
    <a href="/dashboard" class="flex items-center gap-2">
      <div class="w-6 h-6 bg-white flex items-center justify-content-center rounded-sm flex items-center justify-center">
        <svg class="icon text-black text-xs" aria-hidden="true"><use href="#icon-terminal"></use></svg>
      </div>
      <span class="font-mono text-xs font-bold tracking-tight">Trangly</span>
    </a>
    <button @click="mobileMenuOpen = true" class="btn-ghost px-2" aria-label="Open menu">
      <svg class="icon" aria-hidden="true"><use href="#icon-bars"></use></svg>
    </button>
  </div>

  <!-- ── Page Shell ──────────────────────────────────────────────── -->
  <div class="page-shell">
    {{block "content" .}}{{end}}
  </div>

  {{block "after_shell" .}}{{end}}

  <script src="/static/js/api.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/datatable.js"></script>
  <script src="/static/js/motion.js"></script>
  {{block "scripts" .}}{{end}}
</body>
</html>
{{end}}
