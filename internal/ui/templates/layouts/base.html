{{define "base"}}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  {{template "head" .}}
  {{block "head_extra" .}}{{end}}
</head>
<body class="font-sans antialiased" x-data="{{.AlpineData}}" x-cloak>
  {{template "sidebar" .}}
  {{template "mobile_menu" .}}

  <!-- Mobile top bar -->
  <div class="mobile-topbar">
    <a href="/dashboard" class="flex items-center gap-2">
      <div class="w-6 h-6 bg-white flex items-center justify-content-center rounded-sm flex items-center justify-center">
        <i class="fa-solid fa-terminal text-black text-xs"></i>
      </div>
      <span class="font-mono text-xs font-bold tracking-tight">Trangly</span>
    </a>
    <button @click="mobileMenuOpen = true" class="btn-ghost px-2" aria-label="Open menu">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>

  <!-- ── Page Shell ──────────────────────────────────────────────── -->
  <div class="page-shell">
    {{block "content" .}}{{end}}
  </div>

  {{block "after_shell" .}}{{end}}

  <script src="/static/js/api.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/datatable.js"></script>
  {{block "scripts" .}}{{end}}
</body>
</html>
{{end}}
